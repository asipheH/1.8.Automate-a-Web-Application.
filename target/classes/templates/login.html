<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Login</title>
</head>
<body>
    <h1>Employee Login</h1>
    <p>Sign in with your employee account</p>

    <p id="success-message" th:if="${success}" th:text="${success}" style="color: green;"></p>

    <p id="error-message" th:if="${error}" th:text="${error}" style="color: red;"></p>

    <form action="/login" method="post">

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required>
        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" required>
        <br><br>
        
        <button type="submit" id="loginButton">Login</button>
    </form>

    <p>Don't have an account yet?<a href="/register" id="registerLink">Register Here</a></p>
</body>
</html>
